<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Shivuuu ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <audio id="bgMusic" loop>
        <source src="https://assets.mixkit.co/active_storage/sfx/2518/2518-preview.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <div class="box">
            <h1 class="pulse">Will you forever be mine? ❤️</h1>
            <p class="recipient"><b>Shivuuu</b></p>
            <p class="sender">From: <b>Ranjan Roy</b></p>
            
            <div class="button-container">
                <button class="btn btn-yes" onclick="handleYes()">💚 YES</button>
                <button class="btn btn-no" onclick="handleNo()">💔 NO</button>
            </div>
            
            <p class="response" id="response"></p>
        </div>
    </div>

    <!-- Falling hearts container -->
    <div id="hearts-container"></div>

    <script src="script.js"></script>
</body>
</html>
